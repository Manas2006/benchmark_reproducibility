
# Supported libraries: [trl, openr1, verl]
library: trl  # Default to TRL

# Output settings
output_dir: "outputs"  # Base directory for all outputs
experiment_name: "default"  # Name of this experiment run

seed: 42
algorithm:
  name: ppo  # one of [ppo, grpo, dpo]
verbose: true

# Model settings
model:
  pretrained_name: "Qwen/Qwen2.5-Math-1.5B" 
  device_map: "auto"  
  load_in_8bit: false  
  load_in_4bit: false  

# Dataset settings
dataset:
  name: ""  # Must be set (HF dataset ID or local path)
  split: train
  batch_size: 8
  max_length: 512
  num_workers: 4
  data_files: null  # Optional local data files

# Reward model settings
# for using reward function, set type to custom and use custom_path to file path of reward function
reward_model:
  type: ""  # Must be set (pipeline or custom)
  name: ""  # Must be set for pipeline type
  custom_path: ""  # Must be set for custom type
  device: "cuda" if torch.cuda.is_available() else "cpu"

# Training settings
training:
  output_dir: "${output_dir}/${experiment_name}"  # Where to save model and metrics
  learning_rate: 3e-5
  num_train_epochs: 3
  batch_size: 8
  max_grad_norm: 1.0
  do_eval: true  # Whether to run evaluation
  system_prompt: "You are a helpful AI Assistant that provides well-reasoned and detailed responses. You first think about the reasoning process as an internal monologue and then provide the user with the answer. Respond in the following format: <think>\n...\n</think>\n<answer>\n...\n</answer>"  # Optional system prompt for chat models






